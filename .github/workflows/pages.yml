# main にプッシュすると GitHub Pages に公開する。
# そのとき Secrets の TURN_USERNAME / TURN_CREDENTIAL から js/net/turn-config.js を作る（リポジトリには入れない）。
# 使う前に：Settings → Pages → Build and deployment の Source を「GitHub Actions」にする。
name: GitHub Pages に公開

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: TURN の設定を書き込む（Secrets から）
        env:
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          TURN_URLS: ${{ vars.TURN_URLS }}
        run: node .github/scripts/write-turn-config.js
      - id: pages
        uses: actions/configure-pages@v5
      - name: OGP の URL を絶対パスにする（SNS のカードに画像を出すため）
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node .github/scripts/write-ogp-url.js
      - name: オフライン用の保存（Service Worker）の名前を、この版のものにする
        run: sed -i "s/const CACHE = 'rr-dev';/const CACHE = 'rr-${GITHUB_SHA::8}';/" sw.js && grep -n "const CACHE" sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # アップロードした直後は GitHub 側にまだ見えていないことがあるので、少し待ってから公開する（失敗したらもう一度）
      - name: アップロードが GitHub に登録されるのを待つ
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: 公開に失敗したら少し待つ
        if: steps.deployment.outcome == 'failure'
        run: sleep 45
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
